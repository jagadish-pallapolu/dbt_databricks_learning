version: 2

models:
  - name: silver_customers
    description: "Conformed customer master records"
    columns:
      - name: customer_id
        description: "Primary key for customer"
        data_tests:
          - unique
          - not_null
      - name: email
        description: "Validated customer email address"
        data_tests:
          - not_null

  - name: silver_products
    description: "Catalog of products with financial cost & unit margins"
    columns:
      - name: product_id
        description: "Primary key for product"
        data_tests:
          - unique
          - not_null
      - name: category
        description: "Product merchandise category"
        data_tests:
          - not_null

  - name: silver_orders
    description: "Cleaned and financially enriched order transactions"
    columns:
      - name: order_id
        description: "Primary key for orders"
        data_tests:
          - unique
          - not_null
      - name: customer_id
        description: "Foreign key referencing silver_customers"
        data_tests:
          - relationships:
              arguments:
                to: ref('silver_customers')
                field: customer_id
      - name: product_id
        description: "Foreign key referencing silver_products"
        data_tests:
          - relationships:
              arguments:
                to: ref('silver_products')
                field: product_id
      - name: status
        description: "Order status code"
        data_tests:
          - accepted_values:
              arguments:
                values: ['completed', 'shipped', 'cancelled', 'returned']
